<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b14" />
      <stop offset="100%" stop-color="#0c1426" />
    </linearGradient>
    <linearGradient id="deaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2e4f" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bgGrad)" />

  <text x="500" y="45" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="900" font-size="22" text-anchor="middle">Zero-Trust Diameter Roaming &amp; DEA Signaling Architecture</text>
  <text x="500" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">RFC 6733 Base Protocol, GSMA FS.19 DEA Topology Hiding, and Dual-Path SCTP Multi-Homing</text>

  <!-- Left: Internal Home Core Network -->
  <rect x="60" y="130" width="300" height="280" rx="10" fill="#091120" stroke="#1e2e4f" />
  <text x="210" y="160" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">Home Operator EPC/IMS Core</text>

  <!-- Core Node 1: MME / HSS -->
  <rect x="90" y="180" width="240" height="60" rx="6" fill="url(#nodeGrad)" stroke="#38bdf8" />
  <text x="210" y="205" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">MME / HSS (S6a Authentication)</text>
  <text x="210" y="225" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">App-ID: 16777251 | ULR / ULA</text>

  <!-- Core Node 2: PGW / PCRF -->
  <rect x="90" y="255" width="240" height="60" rx="6" fill="url(#nodeGrad)" stroke="#38bdf8" />
  <text x="210" y="280" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">PGW / PCRF (Gx Policy)</text>
  <text x="210" y="300" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">App-ID: 16777238 | CCR / CCA</text>

  <!-- Core Node 3: OCS (Charging) -->
  <rect x="90" y="330" width="240" height="60" rx="6" fill="url(#nodeGrad)" stroke="#38bdf8" />
  <text x="210" y="355" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Online Charging System (Gy/Ro)</text>
  <text x="210" y="375" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">App-ID: 4 (DCCA) | Real-time Quota</text>

  <!-- Center: Diameter Edge Agent (DEA / DRA) -->
  <rect x="420" y="160" width="220" height="220" rx="10" fill="url(#nodeGrad)" stroke="#f59e0b" stroke-width="2" />
  <text x="530" y="195" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">Diameter Edge Agent (DEA)</text>
  <text x="530" y="215" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">Origin: dra01.carrier.net</text>

  <!-- DEA Security Features inside box -->
  <rect x="435" y="235" width="190" height="28" rx="4" fill="#091120" stroke="#10b981" />
  <text x="530" y="253" fill="#34d399" font-family="monospace" font-weight="bold" font-size="10" text-anchor="middle">✓ GSMA FS.19 Topology Hiding</text>

  <rect x="435" y="275" width="190" height="28" rx="4" fill="#091120" stroke="#10b981" />
  <text x="530" y="293" fill="#34d399" font-family="monospace" font-weight="bold" font-size="10" text-anchor="middle">✓ S6a Command Screening</text>

  <rect x="435" y="315" width="190" height="28" rx="4" fill="#091120" stroke="#10b981" />
  <text x="530" y="333" fill="#34d399" font-family="monospace" font-weight="bold" font-size="10" text-anchor="middle">✓ AVP Credential Stripping</text>

  <!-- Internal links to DEA -->
  <line x1="330" y1="270" x2="420" y2="270" stroke="#38bdf8" stroke-width="3" />
  <text x="375" y="260" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Internal Core</text>

  <!-- Dual-Path SCTP Multi-Homing to External IPX -->
  <!-- Primary Path -->
  <path d="M 640 240 Q 720 220 800 240" stroke="#10b981" stroke-width="3" fill="none" />
  <text x="720" y="225" fill="#34d399" font-family="monospace" font-weight="bold" font-size="10" text-anchor="middle">SCTP Path A (Primary)</text>

  <!-- Secondary Path -->
  <path d="M 640 300 Q 720 320 800 300" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" fill="none" />
  <text x="720" y="335" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">SCTP Path B (Backup)</text>

  <!-- Right: External IPX Roaming Cloud -->
  <rect x="800" y="160" width="160" height="220" rx="10" fill="url(#nodeGrad)" stroke="#818cf8" stroke-width="1.5" />
  <text x="880" y="195" fill="#a5b4fc" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">IPX Roaming Peer</text>
  <text x="880" y="218" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">roaming-ipx.net</text>
  <rect x="815" y="240" width="130" height="60" rx="6" fill="#091120" stroke="#10b981" />
  <text x="880" y="265" fill="#34d399" font-family="monospace" font-weight="bold" font-size="11" text-anchor="middle">mTLS / IPsec</text>
  <text x="880" y="285" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Port 3868 / 5868</text>

  <!-- Bottom Callout: GSMA FS.19 Security Threat Defense -->
  <rect x="60" y="440" width="900" height="170" rx="10" fill="#091120" stroke="#1e2e4f" />
  <text x="510" y="470" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">GSMA FS.19 / FS.07 Roaming Security Protection Matrix</text>
  <line x1="80" y1="485" x2="940" y2="485" stroke="#1e2e4f" />

  <text x="90" y="510" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="12">1. Topology Hiding</text>
  <text x="90" y="530" fill="#94a3b8" font-family="sans-serif" font-size="11">Replaces internal FQDNs with generic aliases; external IPX peers cannot map core HSS/MME nodes.</text>

  <text x="90" y="555" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="12">2. S6a Command Code Screening</text>
  <text x="90" y="575" fill="#94a3b8" font-family="sans-serif" font-size="11">Drops unauthorized Cancel-Location &amp; Purge-UE messages; prevents rogue operators from detaching subscribers.</text>

  <text x="520" y="510" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="12">3. SCTP Multi-Homing Redundancy</text>
  <text x="520" y="530" fill="#94a3b8" font-family="sans-serif" font-size="11">Dual physical IP paths with 30s watchdog heartbeat; sub-second failover prevents billing drops.</text>

  <text x="520" y="555" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="12">4. M-bit Strict Compliance</text>
  <text x="520" y="575" fill="#94a3b8" font-family="sans-serif" font-size="11">Ensures optional vendor attributes leave M=0, eliminating DIAMETER_AVP_UNSUPPORTED (5001) errors.</text>
</svg>
